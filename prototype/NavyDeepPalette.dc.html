<div style="height: 44px; border-radius: 10px; background: #1B2E4C"></div>
<span style="font-size: 12px; line-height: 17px; font-weight: 500">藏蓝 · 重色</span>

<div style="display: flex; flex-direction: column; gap: 6px">
