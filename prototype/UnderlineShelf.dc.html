<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Underline · 书架</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #9EC0C0; color: #1C1C1C; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif">

<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow-y: auto; scrollbar-width: none; box-sizing: border-box; padding: 44px 0 124px 0">

<div style="padding: 0 12px 0 24px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 30px; line-height: 44px; letter-spacing: 2px; color: #1C1C1C">书架</h1>
<button type="button" aria-label="搜索书架" style="width: 44px; height: 44px; border: 0; padding: 0; background: transparent; color: #1C1C1C; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
</button>
</div>
<p style="margin: 0; font-size: 13px; line-height: 20px; color: #1C1C1C">{{countText}}</p>
</div>

<div style="padding: 16px 24px 0 24px">
<div role="group" aria-label="筛选" style="display: inline-flex; gap: 2px; padding: 3px; border: 1.5px solid #1C1C1C; border-radius: 22px; background: #FBF8F1">
<sc-for list="{{segs}}" as="g" hint-placeholder-count="3">
<button type="button" aria-pressed="{{g.pressed}}" onClick="{{g.pick}}" style="height: 36px; box-sizing: border-box; padding: 0 16px; border: 0; border-radius: 18px; background: {{g.bg}}; color: {{g.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{g.label}}</button>
</sc-for>
</div>
</div>

<div style="padding: 22px 20px 0 20px">
<div style="display: flex; align-items: flex-end; gap: 8px; padding: 14px 14px 0 14px; min-height: 178px; box-sizing: border-box">
<sc-for list="{{books}}" as="b" hint-placeholder-count="4">
<button type="button" aria-label="{{b.title}}" aria-pressed="{{b.pressed}}" onClick="{{b.pick}}" style="position: relative; flex-shrink: 0; width: {{b.w}}px; height: {{b.h}}px; box-sizing: border-box; padding: 16px 0 12px 0; border: 1.5px solid #1C1C1C; border-bottom: 0; border-radius: 4px 4px 0 0; background: {{b.color}}; color: {{b.fg}}; transform: {{b.lift}}; box-shadow: {{b.shadow}}; transition: transform 160ms ease; display: flex; justify-content: center; font-family: inherit; cursor: pointer">
<span aria-hidden="true" style="position: absolute; left: 6px; right: 6px; top: 7px; height: 1.5px; background: currentColor; opacity: 0.55"></span>
<span style="writing-mode: vertical-rl; font-family: Newsreader, Georgia, serif; font-size: 12px; line-height: 14px; font-weight: 500; letter-spacing: 0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: 100%">{{b.title}}</span>
<span aria-hidden="true" style="position: absolute; left: 6px; right: 6px; bottom: 6px; height: 1.5px; background: currentColor; opacity: 0.55"></span>
</button>
</sc-for>
<a href="GreetB.dc.html" aria-label="去日推里加一本" style="flex-shrink: 0; width: 44px; height: 112px; box-sizing: border-box; border: 1.5px dashed #1C1C1C; border-bottom: 0; border-radius: 4px 4px 0 0; display: flex; align-items: center; justify-content: center; color: #1C1C1C; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
</a>
</div>
<div aria-hidden="true" style="height: 14px; box-sizing: border-box; background: #FBF8F1; border: 1.5px solid #1C1C1C; border-radius: 3px; box-shadow: 3px 3px 0 #1C1C1C"></div>
</div>

<div style="padding: 24px 16px 0 16px">
<sc-if value="{{hasSel}}" hint-placeholder-val="{{true}}">
<div style="box-sizing: border-box; background: #FBF8F1; border: 1.5px solid #1C1C1C; border-radius: 18px; box-shadow: 4px 4px 0 #1C1C1C; padding: 16px 16px 18px 18px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 6px">
<span style="font-size: 17px; line-height: 24px; font-weight: 700; color: #925F50">#</span>
<span style="font-size: 15px; line-height: 24px; font-weight: 600">日推</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 18px; line-height: 24px; font-weight: 500">{{sel.no}}</span>
<span style="display: inline-flex; align-items: center; height: 20px; box-sizing: border-box; padding: 0 7px; margin-left: 2px; border: 1.5px solid #1C1C1C; border-radius: 10px; font-size: 11px; font-weight: 600">拆书</span>
</span>
<span style="font-size: 12px; line-height: 17px; font-weight: 500; color: #2F5E60">已看 {{sel.count}}/4</span>
</div>
<h2 style="margin: 12px 0 0 0; font-family: Newsreader, Georgia, serif; font-weight: 500; font-size: 24px; line-height: 30px; letter-spacing: -0.2px; color: #1C1C1C; text-decoration-line: underline; text-decoration-color: #D89585; text-decoration-thickness: 3px; text-underline-offset: 5px">{{sel.title}}</h2>
<div style="margin-top: 4px; font-family: Newsreader, Georgia, serif; font-style: italic; font-size: 14px; line-height: 18px; color: #56524D">{{sel.author}}</div>
<div style="margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{sel.tiles}}" as="t" hint-placeholder-count="4">
<button type="button" onClick="{{t.open}}" style="height: 60px; box-sizing: border-box; padding: 0 10px; border: 1.5px solid #1C1C1C; border-radius: 12px; background: {{t.bg}}; display: flex; align-items: center; gap: 10px; font-family: inherit; color: #1C1C1C; cursor: pointer; text-align: left">
<span aria-hidden="true" style="position: relative; width: 26px; height: 32px; flex-shrink: 0; box-sizing: border-box; border-radius: 4px; background: {{t.badgeBg}}; clip-path: polygon(0 0, 66% 0, 100% 28%, 100% 100%, 0 100%); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px">
<span style="position: absolute; right: 0; top: 0; width: 34%; height: 28%; background: rgba(255, 255, 255, 0.42); clip-path: polygon(0 0, 0 100%, 100% 100%)"></span>
<span style="font-size: 8px; line-height: 9px; font-weight: 700; letter-spacing: 0.3px; color: {{t.badgeFg}}">{{t.badge}}</span>
</span>
<span style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; line-height: 18px; font-weight: 500">{{t.label}}</span>
<span style="font-size: 11px; line-height: 15px; font-weight: 500; color: {{t.statusColor}}">{{t.status}}</span>
</span>
</button>
</sc-for>
</div>
<div style="margin-top: 16px; display: flex; gap: 10px">
<a href="#" style="flex-grow: 1; height: 44px; box-sizing: border-box; border-radius: 22px; background: #1C1C1C; color: #FBF8F1; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; text-decoration: none">
<span>继续读</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</a>
<button type="button" onClick="{{removeSel}}" style="height: 44px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #1C1C1C; border-radius: 22px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #1C1C1C; cursor: pointer">移出书架</button>
</div>
</div>
</sc-if>
<sc-if value="{{noSel}}" hint-placeholder-val="{{false}}">
<div style="box-sizing: border-box; background: #FBF8F1; border: 1.5px dashed #1C1C1C; border-radius: 18px; padding: 22px 18px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 15px; line-height: 22px; font-weight: 600">这一层还空着</span>
<span style="font-size: 13px; line-height: 20px; color: #56524D">在日推里点“加入书架”，书就会放到这里。</span>
</div>
</sc-if>
</div>

</div>

<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 100px; height: 48px; box-sizing: border-box; padding: 0 6px 0 16px; border-radius: 14px; background: #1C1C1C; color: #FBF8F1; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 10px 24px rgba(28, 28, 28, 0.28)">
<span style="min-width: 0; font-size: 13px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">已移出 {{toastTitle}}</span>
<button type="button" onClick="{{undo}}" style="height: 40px; flex-shrink: 0; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; font-family: inherit; font-size: 13px; font-weight: 700; color: #9EC0C0; cursor: pointer">撤销</button>
</div>
</sc-if>

<nav aria-label="主导航" style="position: absolute; left: 101px; bottom: 30px; display: flex; gap: 4px; padding: 6px; border-radius: 28px; background: #1C1C1C; box-shadow: 0 10px 24px rgba(28, 28, 28, 0.28)">
<a href="GreetB.dc.html" aria-label="今日" style="width: 56px; height: 44px; border-radius: 22px; background: transparent; color: #D9D4C9; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2"></rect><path d="M7 10h6"></path><path d="M7 14h10"></path></svg>
</a>
<a href="#" aria-label="书架" aria-current="page" style="width: 56px; height: 44px; border-radius: 22px; background: #9EC0C0; color: #1C1C1C; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
</a>
<button type="button" aria-label="我的" style="width: 56px; height: 44px; border: 0; padding: 0; border-radius: 22px; background: transparent; color: #D9D4C9; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="10" r="3"></circle><path d="M6.5 18.5c1.3-2.2 3.3-3.3 5.5-3.3s4.2 1.1 5.5 3.3"></path></svg>
</button>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      filter: 'all',
      sel: 'hkp',
      removed: {},
      toast: null,
      opened: {
        hkp: [true, false, false, false],
        tag: [true, true, true, true],
        ah: [true, true, true, true],
        tfs: [true, true, false, false]
      }
    };
  }

  openTile(id, i) {
    const prev = (this.state && this.state.opened) || {};
    const opened = Object.assign({}, prev);
    const arr = (opened[id] || [false, false, false, false]).slice();
    arr[i] = true;
    opened[id] = arr;
    this.setState({ opened: opened });
  }

  renderVals() {
    const s = this.state || {};
    const filter = s.filter || 'all';
    const removed = s.removed || {};
    const opened = s.opened || {};
    const BOOKS = [
      { id: 'hkp', no: '496', title: 'How to Know a Person', author: 'David Brooks', color: '#D89585', fg: '#1C1C1C', w: 48, h: 150 },
      { id: 'tag', no: '495', title: 'The Anxious Generation', author: 'Jonathan Haidt', color: '#1C1C1C', fg: '#FBF8F1', w: 50, h: 156 },
      { id: 'ah', no: '494', title: 'Atomic Habits', author: 'James Clear', color: '#2F5E60', fg: '#FBF8F1', w: 52, h: 136 },
      { id: 'tfs', no: '493', title: 'Thinking, Fast and Slow', author: 'Daniel Kahneman', color: '#925F50', fg: '#FBF8F1', w: 46, h: 164 }
    ];
    const RES = [
      { label: '优质语段精选', badge: 'PDF', badgeBg: '#925F50', badgeFg: '#FBF8F1' },
      { label: '全书思维导图', badge: 'MAP', badgeBg: '#2F5E60', badgeFg: '#FBF8F1' },
      { label: '关键表达词库', badge: 'DOC', badgeBg: '#1C1C1C', badgeFg: '#FBF8F1' },
      { label: '拆书播客', badge: 'AUD', badgeBg: '#D89585', badgeFg: '#1C1C1C' }
    ];
    const all = BOOKS.filter((b) => !removed[b.id]).map((b) => {
      const o = opened[b.id] || [false, false, false, false];
      const count = o.filter(Boolean).length;
      return Object.assign({}, b, { o: o, count: count, done: count === 4 });
    });
    const visible = all.filter((b) => filter === 'all' || (filter === 'done' ? b.done : !b.done));
    let selId = s.sel;
    if (!visible.some((b) => b.id === selId)) selId = visible.length ? visible[0].id : null;
    const books = visible.map((b) => {
      const on = b.id === selId;
      return Object.assign({}, b, {
        pressed: on ? 'true' : 'false',
        lift: on ? 'translateY(-14px)' : 'none',
        shadow: on ? '3px 3px 0 #1C1C1C' : 'none',
        pick: () => this.setState({ sel: b.id })
      });
    });
    const selB = all.find((b) => b.id === selId) || null;
    const sel = selB
      ? Object.assign({}, selB, {
          tiles: RES.map((r, i) => {
            const isOpened = !!selB.o[i];
            return Object.assign({}, r, {
              bg: isOpened ? '#E6EFEE' : '#FFFDF8',
              status: isOpened ? '已看' : '未看',
              statusColor: isOpened ? '#2F5E60' : '#56524D',
              open: () => this.openTile(selB.id, i)
            });
          })
        })
      : { no: '', title: '', author: '', count: 0, tiles: [] };
    const doneCount = all.filter((b) => b.done).length;
    const segDefs = [
      { id: 'all', label: '全部 ' + all.length },
      { id: 'reading', label: '在读 ' + (all.length - doneCount) },
      { id: 'done', label: '读完 ' + doneCount }
    ];
    const segs = segDefs.map((g) => ({
      label: g.label,
      bg: filter === g.id ? '#1C1C1C' : 'transparent',
      fg: filter === g.id ? '#FBF8F1' : '#1C1C1C',
      pressed: filter === g.id ? 'true' : 'false',
      pick: () => this.setState({ filter: g.id })
    }));
    const totalOpened = all.reduce((n, b) => n + b.count, 0);
    const toastBook = s.toast ? BOOKS.find((b) => b.id === s.toast) : null;
    return {
      countText: all.length + ' 本书 · 已看 ' + totalOpened + ' 份资料',
      segs: segs,
      books: books,
      sel: sel,
      hasSel: !!selB,
      noSel: !selB,
      removeSel: () => {
        if (!selB) return;
        const r = Object.assign({}, removed);
        r[selB.id] = true;
        this.setState({ removed: r, toast: selB.id });
      },
      hasToast: !!toastBook,
      toastTitle: toastBook ? toastBook.title : '',
      undo: () => {
        if (!s.toast) return;
        const r = Object.assign({}, removed);
        delete r[s.toast];
        this.setState({ removed: r, sel: s.toast, toast: null });
      }
    };
  }
}
</script>
</body>
</html>
