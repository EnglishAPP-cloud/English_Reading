<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>资料库 1 · 筛选胶囊</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #9EC0C0; color: #1C1C1C; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif">

<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow-y: auto; scrollbar-width: none; box-sizing: border-box; padding: 44px 0 124px 0">

<div style="padding: 0 12px 0 24px; display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 30px; line-height: 44px; letter-spacing: 2px">资料库</h1>
<button type="button" aria-label="搜索" style="width: 44px; height: 44px; border: 0; padding: 0; background: transparent; color: #1C1C1C; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
</button>
</div>

<div role="group" aria-label="分类" style="display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 14px 24px 4px 24px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="flex-shrink: 0; height: 38px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #1C1C1C; border-radius: 19px; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; gap: 7px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">
<sc-if value="{{c.hasDot}}" hint-placeholder-val="{{true}}">
<span aria-hidden="true" style="width: 9px; height: 9px; box-sizing: border-box; border-radius: 5px; border: 1.5px solid {{c.fg}}; background: {{c.dot}}"></span>
</sc-if>
<span>{{c.label}}</span>
</button>
</sc-for>
</div>

<div style="padding: 10px 12px 0 18px; display: flex; align-items: center; justify-content: space-between">
<button type="button" style="height: 44px; border: 0; padding: 0 6px; background: transparent; display: flex; align-items: center; gap: 6px; font-family: inherit; font-size: 13px; font-weight: 600; color: #1C1C1C; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14"></path><path d="M4.5 8.5L8 5l3.5 3.5"></path><path d="M16 19V5"></path><path d="M12.5 15.5L16 19l3.5-3.5"></path></svg>
<span>最近加入</span>
</button>
<button type="button" aria-label="切换列表与网格" onClick="{{toggleView}}" style="width: 44px; height: 44px; border: 0; padding: 0; background: transparent; color: #1C1C1C; display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{isList}}" hint-placeholder-val="{{true}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>
</sc-if>
<sc-if value="{{isGrid}}" hint-placeholder-val="{{false}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
</sc-if>
</button>
</div>

<sc-if value="{{isList}}" hint-placeholder-val="{{true}}">
<div style="margin: 4px 16px 0 16px; box-sizing: border-box; background: #FBF8F1; border: 1.5px solid #1C1C1C; border-radius: 18px; box-shadow: 4px 4px 0 #1C1C1C; padding: 6px 0">
<sc-for list="{{items}}" as="it" hint-placeholder-count="8">
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 8px 14px; text-decoration: none; color: #1C1C1C">
<span aria-hidden="true" style="width: 50px; height: 50px; flex-shrink: 0; box-sizing: border-box; border: 1.5px solid #1C1C1C; border-radius: 10px; background: {{it.color}}; color: {{it.fg}}; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 20px">{{it.glyph}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-family: Newsreader, 'Noto Sans SC', serif; font-size: 16px; line-height: 21px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</span>
<span style="display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 16px; color: #56524D; white-space: nowrap; overflow: hidden">
<sc-if value="{{it.pinned}}" hint-placeholder-val="{{false}}">
<svg width="13" height="13" viewBox="0 0 24 24" fill="#2F5E60" aria-label="已置顶"><path d="M14.5 3.5l6 6-3 1.5-3.5 3.5.5 4-2 2-3.5-3.5L4 21l-1-1 4-5-3.5-3.5 2-2 4 .5L13 6.5z"></path></svg>
</sc-if>
<span>{{it.typeLabel}} · {{it.meta}}</span>
</span>
</span>
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9" fill="none" stroke="#E1DDD3" stroke-width="3"></circle><circle cx="12" cy="12" r="9" fill="none" stroke="#1C1C1C" stroke-width="3" stroke-dasharray="{{it.dash}}" transform="rotate(-90 12 12)"></circle></svg>
</a>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isGrid}}" hint-placeholder-val="{{false}}">
<div style="padding: 4px 16px 0 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<a href="#" style="display: flex; flex-direction: column; box-sizing: border-box; background: #FBF8F1; border: 1.5px solid #1C1C1C; border-radius: 14px; box-shadow: 3px 3px 0 #1C1C1C; overflow: hidden; text-decoration: none; color: #1C1C1C">
<span aria-hidden="true" style="height: 92px; background: {{it.color}}; color: {{it.fg}}; border-bottom: 1.5px solid #1C1C1C; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 34px">{{it.glyph}}</span>
<span style="padding: 10px 12px 12px 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: Newsreader, 'Noto Sans SC', serif; font-size: 15px; line-height: 19px; font-weight: 500; height: 38px; overflow: hidden">{{it.title}}</span>
<span style="font-size: 11px; line-height: 15px; color: #56524D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.typeLabel}} · {{it.meta}}</span>
<span aria-hidden="true" style="margin-top: 6px; height: 3px; border-radius: 2px; background: #E1DDD3; overflow: hidden; display: flex"><span style="width: {{it.pct}}; background: #1C1C1C"></span></span>
</span>
</a>
</sc-for>
</div>
</sc-if>

</div>

<nav aria-label="主导航" style="position: absolute; left: 101px; bottom: 30px; display: flex; gap: 4px; padding: 6px; border-radius: 28px; background: #1C1C1C; box-shadow: 0 10px 24px rgba(28, 28, 28, 0.28)">
<a href="GreetB.dc.html" aria-label="今日" style="width: 56px; height: 44px; border-radius: 22px; color: #D9D4C9; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2"></rect><path d="M7 10h6"></path><path d="M7 14h10"></path></svg>
</a>
<a href="#" aria-label="资料库" aria-current="page" style="width: 56px; height: 44px; border-radius: 22px; background: #9EC0C0; color: #1C1C1C; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
</a>
<button type="button" aria-label="我的" style="width: 56px; height: 44px; border: 0; padding: 0; border-radius: 22px; background: transparent; color: #D9D4C9; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="10" r="3"></circle><path d="M6.5 18.5c1.3-2.2 3.3-3.3 5.5-3.3s4.2 1.1 5.5 3.3"></path></svg>
</button>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', view: 'list' };
  }

  renderVals() {
    const s = this.state || {};
    const filter = s.filter || 'all';
    const view = s.view || 'list';
    const TYPES = {
      news: { label: '资讯', glyph: '资', color: '#925F50', fg: '#FBF8F1' },
      pro: { label: '专业', glyph: '专', color: '#2F5E60', fg: '#FBF8F1' },
      book: { label: '拆书', glyph: '拆', color: '#1C1C1C', fg: '#FBF8F1' },
      pod: { label: '播客', glyph: '播', color: '#D89585', fg: '#1C1C1C' }
    };
    const DATA = [
      { type: 'news', title: 'Why Every Company Suddenly Wants an AI Agent', meta: '六级 · 418 词', p: 0.6, pinned: true },
      { type: 'book', title: 'How to Know a Person', meta: 'David Brooks', p: 0.25, pinned: true },
      { type: 'pod', title: '拆书播客 · How to Know a Person', meta: '24 分钟', p: 0 },
      { type: 'pro', title: 'Opportunity Cost, Explained', meta: '经济学 · 托雅', p: 1 },
      { type: 'news', title: 'What a Four-Day Week Really Changes', meta: '四级 · 536 词', p: 1 },
      { type: 'pro', title: 'The Spotlight Effect', meta: '心理学 · 六级', p: 0.4 },
      { type: 'book', title: 'Atomic Habits', meta: 'James Clear', p: 1 },
      { type: 'pod', title: '资讯快听 · AI Agents', meta: '12 分钟', p: 0.7 },
      { type: 'pro', title: 'How Neural Networks Learn', meta: '计算机 · 托雅', p: 0 },
      { type: 'book', title: 'Thinking, Fast and Slow', meta: 'Daniel Kahneman', p: 0.5 },
      { type: 'news', title: 'The Science of Procrastination', meta: '四级 · 472 词', p: 0.3 },
      { type: 'book', title: 'The Anxious Generation', meta: 'Jonathan Haidt', p: 1 }
    ];
    const C = 2 * Math.PI * 9;
    const items = DATA.filter((d) => filter === 'all' || d.type === filter).map((d) => {
      const t = TYPES[d.type];
      return {
        title: d.title,
        meta: d.meta,
        pinned: !!d.pinned,
        typeLabel: t.label,
        glyph: t.glyph,
        color: t.color,
        fg: t.fg,
        dash: (d.p * C).toFixed(2) + ' ' + C.toFixed(2),
        pct: Math.round(d.p * 100) + '%'
      };
    });
    const chipDefs = [
      { id: 'all', label: '全部', dot: null },
      { id: 'news', label: '资讯', dot: '#925F50' },
      { id: 'pro', label: '专业', dot: '#2F5E60' },
      { id: 'book', label: '拆书', dot: '#1C1C1C' },
      { id: 'pod', label: '播客', dot: '#D89585' }
    ];
    const chips = chipDefs.map((c) => {
      const on = filter === c.id;
      return {
        label: c.label,
        hasDot: !!c.dot,
        dot: c.dot || 'transparent',
        bg: on ? '#1C1C1C' : '#FBF8F1',
        fg: on ? '#FBF8F1' : '#1C1C1C',
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ filter: c.id })
      };
    });
    return {
      chips: chips,
      items: items,
      isList: view === 'list',
      isGrid: view === 'grid',
      toggleView: () => this.setState({ view: view === 'list' ? 'grid' : 'list' })
    };
  }
}
</script>
</body>
</html>
