<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>雾蓝 · 色板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0;background:#F1F5F9}
</style>
</helmet>
<div style="width: 390px; height: 400px; box-sizing: border-box; padding: 28px 24px; background: #F1F5F9; color: #15212D; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: baseline; gap: 10px">
<h1 style="margin: 0; font-family: 'Noto Serif SC', serif; font-size: 22px; line-height: 30px; font-weight: 600; color: #15212D">雾蓝</h1>
<span style="font-family: Newsreader, Georgia, serif; font-style: italic; font-size: 16px; color: #586573">Mist</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 44px; border-radius: 10px; background: #3672A6; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06)"></div>
<span style="font-size: 12px; line-height: 17px; font-weight: 500">主色</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 12px; line-height: 16px; color: #586573">#3672A6</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 44px; border-radius: 10px; background: #E2EDF6; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06)"></div>
<span style="font-size: 12px; line-height: 17px; font-weight: 500">浅主色</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 12px; line-height: 16px; color: #586573">#E2EDF6</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 44px; border-radius: 10px; background: #F1F5F9; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08)"></div>
<span style="font-size: 12px; line-height: 17px; font-weight: 500">底色</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 12px; line-height: 16px; color: #586573">#F1F5F9</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 44px; border-radius: 10px; background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08)"></div>
<span style="font-size: 12px; line-height: 17px; font-weight: 500">卡片</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 12px; line-height: 16px; color: #586573">#FFFFFF</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 44px; border-radius: 10px; background: #15212D; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06)"></div>
<span style="font-size: 12px; line-height: 17px; font-weight: 500">正文</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 12px; line-height: 16px; color: #586573">#15212D</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 44px; border-radius: 10px; background: #586573; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06)"></div>
<span style="font-size: 12px; line-height: 17px; font-weight: 500">次要文字</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 12px; line-height: 16px; color: #586573">#586573</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; line-height: 17px; font-weight: 500; color: #586573">小标注</span>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: #E2EDF6; color: #2D6496; font-size: 11px; font-weight: 600; letter-spacing: 0.5px">思想</span>
<span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: #F9E8DE; color: #9E4B24; font-size: 11px; font-weight: 600; letter-spacing: 0.5px">资讯</span>
<span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: #DDF0EA; color: #276B5D; font-size: 11px; font-weight: 600; letter-spacing: 0.5px">专业</span>
<span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: #EBF0F4; color: #586573; font-size: 11px; font-weight: 600; letter-spacing: 0.5px">复习</span>
<span style="width: 1px; height: 14px; margin: 0 4px; background: #D6DEE6"></span>
<span style="display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 6px; border: 1px solid #D6DEE6; color: #586573; font-size: 11px; font-weight: 500">四级</span>
<span style="display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 6px; border: 1px solid #D6DEE6; color: #586573; font-size: 11px; font-weight: 500">六级</span>
<span style="display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 6px; border: 1px solid #D6DEE6; color: #586573; font-size: 11px; font-weight: 500">托雅</span>
</div>
</div>
</div>
</x-dc>
