<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>资料库 V2 · 双标签</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #ECE9E2; color: #1C1C1C; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif">

<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow-y: auto; scrollbar-width: none; box-sizing: border-box; padding: 44px 0 124px 0">

<div style="padding: 0 12px 0 24px; display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 30px; line-height: 44px; letter-spacing: 2px">资料库</h1>
<button type="button" aria-label="搜索" style="width: 44px; height: 44px; border: 0; padding: 0; background: transparent; color: #1C1C1C; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
</button>
</div>

<div role="group" aria-label="模块" style="margin: 12px 16px 0 16px; padding: 3px; box-sizing: border-box; background: #FBF8F1; border: 1.5px solid #1C1C1C; border-radius: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px">
<button type="button" aria-pressed="{{mineStr}}" onClick="{{goMine}}" style="height: 40px; border: 0; border-radius: 20px; background: {{mineBg}}; color: {{mineFg}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">我的书桌</button>
<button type="button" aria-pressed="{{archStr}}" onClick="{{goArch}}" style="height: 40px; border: 0; border-radius: 20px; background: {{archBg}}; color: {{archFg}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">历史资料库</button>
</div>

<sc-if value="{{isArch}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column">

<div style="padding: 16px 16px 0 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">

<button type="button" aria-pressed="{{c.news.pressed}}" onClick="{{c.news.pick}}" style="position: relative; height: 136px; box-sizing: border-box; padding: 6px 12px 10px 12px; background: #FBF8F1; border: 1.5px solid #1C1C1C; border-radius: 14px; box-shadow: {{c.news.shadow}}; display: flex; flex-direction: column; align-items: center; justify-content: space-between; font-family: inherit; color: #1C1C1C; cursor: pointer">
<sc-if value="{{c.news.on}}" hint-placeholder-val="{{false}}">
<span aria-hidden="true" style="position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; box-sizing: border-box; border: 1.5px solid #1C1C1C; border-radius: 11px; background: #9EC0C0; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="#1C1C1C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.4l2.6 2.6L11 4.4"></path></svg></span>
</sc-if>
<svg width="90" height="90" viewBox="0 0 96 96" aria-hidden="true"><defs><pattern id="cor-n2" width="2.8" height="2.8" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="0.95" fill="#D89585"></circle></pattern></defs><ellipse cx="54" cy="78" rx="22" ry="5" fill="#D89585"></ellipse><circle cx="48" cy="44" r="25" fill="#FBF8F1"></circle><path d="M48 19 A25 25 0 0 1 48 69 A11.25 25 0 0 0 48 19 Z" fill="url(#cor-n2)"></path><circle cx="48" cy="44" r="25" fill="none" stroke="#1C1C1C" stroke-width="1.6"></circle><ellipse cx="48" cy="44" rx="11.25" ry="25" fill="none" stroke="#1C1C1C" stroke-width="1.2"></ellipse><path d="M48 19 L48 69" stroke="#1C1C1C" stroke-width="1.2"></path><path d="M23 44 L73 44" stroke="#1C1C1C" stroke-width="1.2"></path><path d="M26.07 32 L69.93 32" stroke="#1C1C1C" stroke-width="1.2"></path><path d="M26.07 56 L69.93 56" stroke="#1C1C1C" stroke-width="1.2"></path><path d="M18 38 A31 31 0 0 0 64 71" fill="none" stroke="#1C1C1C" stroke-width="1.6" stroke-linecap="round"></path><path d="M44 71 L44 77" stroke="#1C1C1C" stroke-width="1.6"></path><ellipse cx="44" cy="78" rx="13" ry="3.5" fill="#FBF8F1" stroke="#1C1C1C" stroke-width="1.6"></ellipse></svg>
<span style="align-self: stretch; display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 14px; line-height: 20px; font-weight: 700">资讯</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 14px; color: #56524D">212</span>
</span>
</button>

<button type="button" aria-pressed="{{c.pro.pressed}}" onClick="{{c.pro.pick}}" style="position: relative; height: 136px; box-sizing: border-box; padding: 6px 12px 10px 12px; background: #FBF8F1; border: 1.5px solid #1C1C1C; border-radius: 14px; box-shadow: {{c.pro.shadow}}; display: flex; flex-direction: column; align-items: center; justify-content: space-between; font-family: inherit; color: #1C1C1C; cursor: pointer">
<sc-if value="{{c.pro.on}}" hint-placeholder-val="{{false}}">
<span aria-hidden="true" style="position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; box-sizing: border-box; border: 1.5px solid #1C1C1C; border-radius: 11px; background: #9EC0C0; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="#1C1C1C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.4l2.6 2.6L11 4.4"></path></svg></span>
</sc-if>
<svg width="90" height="90" viewBox="0 0 96 96" aria-hidden="true"><defs><pattern id="ink-p2" width="2.6" height="2.6" patternUnits="userSpaceOnUse"><circle cx="1.3" cy="1.3" r="0.62" fill="#1C1C1C"></circle></pattern></defs><path d="M52.06 51.5 L86.7 71.5 L62.45 85.5 L27.81 65.5 Z" fill="#D89585"></path><path d="M21.75 62.0 L56.39 82.0 L56.39 73.0 L21.75 53.0 Z" fill="#FBF8F1"></path><path d="M21.75 62.0 L56.39 82.0 L56.39 73.0 L21.75 53.0 Z" fill="url(#ink-p2)"></path><path d="M21.75 62.0 L56.39 82.0 L56.39 73.0 L21.75 53.0 Z" fill="none" stroke="#1C1C1C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path><path d="M80.64 68.0 L56.39 82.0 L56.39 73.0 L80.64 59.0 Z" fill="#FBF8F1"></path><path d="M80.64 68.0 L56.39 82.0 L56.39 73.0 L80.64 59.0 Z" fill="none" stroke="#1C1C1C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path><path d="M46.0 39.0 L80.64 59.0 L56.39 73.0 L21.75 53.0 Z" fill="#FBF8F1"></path><path d="M46.0 39.0 L80.64 59.0 L56.39 73.0 L21.75 53.0 Z" fill="none" stroke="#1C1C1C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path><path d="M78.91 66.0 L58.12 78.0" fill="none" stroke="#1C1C1C" stroke-width="0.9" stroke-linecap="round"></path><path d="M78.91 63.0 L58.12 75.0" fill="none" stroke="#1C1C1C" stroke-width="0.9" stroke-linecap="round"></path><path d="M26.95 54.0 L55.53 70.5 L55.53 62.5 L26.95 46.0 Z" fill="#FBF8F1"></path><path d="M26.95 54.0 L55.53 70.5 L55.53 62.5 L26.95 46.0 Z" fill="url(#ink-p2)"></path><path d="M26.95 54.0 L55.53 70.5 L55.53 62.5 L26.95 46.0 Z" fill="none" stroke="#1C1C1C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path><path d="M75.44 59.0 L55.53 70.5 L55.53 62.5 L75.44 51.0 Z" fill="#FBF8F1"></path><path d="M75.44 59.0 L55.53 70.5 L55.53 62.5 L75.44 51.0 Z" fill="none" stroke="#1C1C1C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path><path d="M46.87 34.5 L75.44 51.0 L55.53 62.5 L26.95 46.0 Z" fill="#FBF8F1"></path><path d="M46.87 34.5 L75.44 51.0 L55.53 62.5 L26.95 46.0 Z" fill="none" stroke="#1C1C1C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path><path d="M73.71 57.33 L57.26 66.83" fill="none" stroke="#1C1C1C" stroke-width="0.9" stroke-linecap="round"></path><path d="M73.71 54.67 L57.26 64.17" fill="none" stroke="#1C1C1C" stroke-width="0.9" stroke-linecap="round"></path><path d="M26.08 44.5 L57.26 62.5 L57.26 55.5 L26.08 37.5 Z" fill="#FBF8F1"></path><path d="M26.08 44.5 L57.26 62.5 L57.26 55.5 L26.08 37.5 Z" fill="url(#ink-p2)"></path><path d="M26.08 44.5 L57.26 62.5 L57.26 55.5 L26.08 37.5 Z" fill="none" stroke="#1C1C1C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path><path d="M74.58 52.5 L57.26 62.5 L57.26 55.5 L74.58 45.5 Z" fill="#FBF8F1"></path><path d="M74.58 52.5 L57.26 62.5 L57.26 55.5 L74.58 45.5 Z" fill="none" stroke="#1C1C1C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path><path d="M43.4 27.5 L74.58 45.5 L57.26 55.5 L26.08 37.5 Z" fill="#FBF8F1"></path><path d="M43.4 27.5 L74.58 45.5 L57.26 55.5 L26.08 37.5 Z" fill="none" stroke="#1C1C1C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path><path d="M72.85 51.17 L58.99 59.17" fill="none" stroke="#1C1C1C" stroke-width="0.9" stroke-linecap="round"></path><path d="M72.85 48.83 L58.99 56.83" fill="none" stroke="#1C1C1C" stroke-width="0.9" stroke-linecap="round"></path><path d="M41.67 46.5 L45.13 48.5 L45.13 61.5 L43.4 57.5 L41.67 59.5 Z" fill="#D89585" stroke="#1C1C1C" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"></path></svg>
<span style="align-self: stretch; display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 14px; line-height: 20px; font-weight: 700">专业领域</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 14px; color: #56524D">146</span>
</span>
</button>

<button type="button" aria-pressed="{{c.book.pressed}}" onClick="{{c.book.pick}}" style="position: relative; height: 136px; box-sizing: border-box; padding: 6px 12px 10px 12px; background: #FBF8F1; border: 1.5px solid #1C1C1C; border-radius: 14px; box-shadow: {{c.book.shadow}}; display: flex; flex-direction: column; align-items: center; justify-content: space-between; font-family: inherit; color: #1C1C1C; cursor: pointer">
<sc-if value="{{c.book.on}}" hint-placeholder-val="{{false}}">
<span aria-hidden="true" style="position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; box-sizing: border-box; border: 1.5px solid #1C1C1C; border-radius: 11px; background: #9EC0C0; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="#1C1C1C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.4l2.6 2.6L11 4.4"></path></svg></span>
</sc-if>
<svg width="90" height="90" viewBox="0 0 96 96" aria-hidden="true"><defs><pattern id="ink-b2" width="2.6" height="2.6" patternUnits="userSpaceOnUse"><circle cx="1.3" cy="1.3" r="0.62" fill="#1C1C1C"></circle></pattern></defs><path d="M50.06 49.5 L86.44 70.5 L60.45 85.5 L24.08 64.5 Z" fill="#D89585"></path><path d="M18.02 61.0 L54.39 82.0 L54.39 70.0 L18.02 49.0 Z" fill="#FBF8F1"></path><path d="M18.02 61.0 L54.39 82.0 L54.39 70.0 L18.02 49.0 Z" fill="url(#ink-b2)"></path><path d="M18.02 61.0 L54.39 82.0 L54.39 70.0 L18.02 49.0 Z" fill="none" stroke="#1C1C1C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path><path d="M80.37 67.0 L54.39 82.0 L54.39 70.0 L80.37 55.0 Z" fill="#FBF8F1"></path><path d="M80.37 67.0 L54.39 82.0 L54.39 70.0 L80.37 55.0 Z" fill="none" stroke="#1C1C1C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path><path d="M44.0 34.0 L80.37 55.0 L54.39 70.0 L18.02 49.0 Z" fill="#FBF8F1"></path><path d="M44.0 34.0 L80.37 55.0 L54.39 70.0 L18.02 49.0 Z" fill="none" stroke="#1C1C1C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path><path d="M78.64 65.0 L56.12 78.0" fill="none" stroke="#1C1C1C" stroke-width="0.8" stroke-linecap="round"></path><path d="M78.64 62.0 L56.12 75.0" fill="none" stroke="#1C1C1C" stroke-width="0.8" stroke-linecap="round"></path><path d="M78.64 59.0 L56.12 72.0" fill="none" stroke="#1C1C1C" stroke-width="0.8" stroke-linecap="round"></path><path d="M33.61 48.0 L54.39 60.0 L51.36 61.75 L30.58 49.75 Z" fill="#D89585" stroke="#1C1C1C" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"></path><path d="M44.0 42.0 L64.78 54.0" fill="none" stroke="#1C1C1C" stroke-width="1.2" stroke-linecap="round"></path><path d="M39.67 44.5 L55.26 53.5" fill="none" stroke="#1C1C1C" stroke-width="1.2" stroke-linecap="round"></path><path d="M72.58 59.5 L69.11 61.5 L69.11 79.5 L70.85 75.5 L72.58 77.5 Z" fill="#D89585" stroke="#1C1C1C" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"></path></svg>
<span style="align-self: stretch; display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 14px; line-height: 20px; font-weight: 700">拆书</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 14px; color: #56524D">96</span>
</span>
</button>

<button type="button" aria-pressed="{{c.pod.pressed}}" onClick="{{c.pod.pick}}" style="position: relative; height: 136px; box-sizing: border-box; padding: 6px 12px 10px 12px; background: #FBF8F1; border: 1.5px solid #1C1C1C; border-radius: 14px; box-shadow: {{c.pod.shadow}}; display: flex; flex-direction: column; align-items: center; justify-content: space-between; font-family: inherit; color: #1C1C1C; cursor: pointer">
<sc-if value="{{c.pod.on}}" hint-placeholder-val="{{false}}">
<span aria-hidden="true" style="position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; box-sizing: border-box; border: 1.5px solid #1C1C1C; border-radius: 11px; background: #9EC0C0; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="#1C1C1C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.4l2.6 2.6L11 4.4"></path></svg></span>
</sc-if>
<svg width="90" height="90" viewBox="0 0 96 96" aria-hidden="true"><defs><pattern id="cor-d2" width="2.8" height="2.8" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="0.95" fill="#D89585"></circle></pattern></defs><ellipse cx="54" cy="81" rx="18" ry="5" fill="#D89585"></ellipse><ellipse cx="48" cy="79" rx="16" ry="4.5" fill="#FBF8F1" stroke="#1C1C1C" stroke-width="1.6"></ellipse><path d="M48 60 L48 75" stroke="#1C1C1C" stroke-width="1.8" stroke-linecap="round"></path><path d="M32 36 L32 42 A16 16 0 0 0 64 42 L64 36" fill="none" stroke="#1C1C1C" stroke-width="1.8" stroke-linecap="round"></path><rect x="37" y="10" width="22" height="42" rx="11" fill="#FBF8F1"></rect><path d="M48 10 A11 11 0 0 1 59 21 L59 41 A11 11 0 0 1 48 52 Z" fill="url(#cor-d2)"></path><rect x="37" y="10" width="22" height="42" rx="11" fill="none" stroke="#1C1C1C" stroke-width="1.6"></rect><path d="M39.5 19 L56.5 19" stroke="#1C1C1C" stroke-width="1"></path><path d="M39.5 24 L56.5 24" stroke="#1C1C1C" stroke-width="1"></path><path d="M39.5 29 L56.5 29" stroke="#1C1C1C" stroke-width="1"></path><path d="M39.5 34 L56.5 34" stroke="#1C1C1C" stroke-width="1"></path><path d="M37 40 L59 40" stroke="#1C1C1C" stroke-width="1.6"></path></svg>
<span style="align-self: stretch; display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 14px; line-height: 20px; font-weight: 700">播客</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 14px; color: #56524D">158</span>
</span>
</button>

</div>

<div style="padding: 16px 16px 0 16px; display: flex; gap: 8px">
<button type="button" style="height: 36px; box-sizing: border-box; padding: 0 10px 0 14px; border: 1.5px solid #1C1C1C; border-radius: 18px; background: #FBF8F1; display: flex; align-items: center; gap: 4px; font-family: inherit; font-size: 13px; font-weight: 600; color: #1C1C1C; cursor: pointer">难度<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" style="height: 36px; box-sizing: border-box; padding: 0 10px 0 14px; border: 1.5px solid #1C1C1C; border-radius: 18px; background: #FBF8F1; display: flex; align-items: center; gap: 4px; font-family: inherit; font-size: 13px; font-weight: 600; color: #1C1C1C; cursor: pointer">时间<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" style="height: 36px; box-sizing: border-box; padding: 0 10px 0 14px; border: 1.5px solid #1C1C1C; border-radius: 18px; background: #FBF8F1; display: flex; align-items: center; gap: 4px; font-family: inherit; font-size: 13px; font-weight: 600; color: #1C1C1C; cursor: pointer">最新<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>

<div style="padding: 18px 24px 0 24px; display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 700">{{listTitle}}</h2>
<span style="font-family: Newsreader, Georgia, serif; font-size: 14px; color: #56524D">{{listCount}}</span>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="padding: 14px 24px 0 24px; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 1px; color: #56524D">{{g.label}}</div>
<div style="margin: 8px 16px 0 16px; box-sizing: border-box; background: #FBF8F1; border: 1.5px solid #1C1C1C; border-radius: 16px; box-shadow: 3px 3px 0 #1C1C1C; padding: 4px 0">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 6px 16px; text-decoration: none; color: #1C1C1C">
<svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true" style="flex-shrink: 0"><circle cx="10" cy="10" r="8.5" fill="none" stroke="#1C1C1C" stroke-width="1.5"></circle><circle cx="10" cy="10" r="4.25" fill="none" stroke="#1C1C1C" stroke-width="8.5" stroke-dasharray="{{it.dash}}" transform="rotate(-90 10 10)"></circle></svg>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: Newsreader, 'Noto Sans SC', serif; font-size: 16px; line-height: 21px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: #56524D">
<span aria-hidden="true" style="width: 9px; height: 9px; box-sizing: border-box; border: 1.5px solid #1C1C1C; border-radius: 2px; background: {{it.color}}"></span>
<span>{{it.typeLabel}} · {{it.meta}}</span>
</span>
</span>
</a>
</sc-for>
</div>
</sc-for>

</div>
</sc-if>

<sc-if value="{{isMine}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column">
<div style="padding: 20px 24px 0 24px">
<h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 700">在看</h2>
</div>
<div style="display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding: 12px 20px 8px 16px">
<sc-for list="{{reading}}" as="it" hint-placeholder-count="3">
<a href="#" style="flex-shrink: 0; width: 212px; box-sizing: border-box; padding: 14px; background: #FBF8F1; border: 1.5px solid #1C1C1C; border-radius: 16px; box-shadow: 3px 3px 0 #1C1C1C; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #1C1C1C">
<span style="display: flex; align-items: center; justify-content: space-between">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'arch', cat: null };
  }

  renderVals() {
    const s = this.state || {};
    const tab = s.tab || 'arch';
    const cat = s.cat || null;
    const C = 2 * Math.PI * 4.25;
    const T = {
      news: { label: '资讯', color: '#925F50', total: 212 },
      pro: { label: '专业', color: '#2F5E60', total: 146 },
      book: { label: '拆书', color: '#1C1C1C', total: 96 },
      pod: { label: '播客', color: '#D89585', total: 158 }
    };
    const GROUPS = [
      { label: '2026 年 9 月', items: [
        { type: 'news', title: 'Why Every Company Suddenly Wants an AI Agent', meta: '六级', p: 0.6 },
        { type: 'book', title: 'How to Know a Person', meta: 'David Brooks', p: 0.25 },
        { type: 'pod', title: '拆书播客 · How to Know a Person', meta: '24 分钟', p: 0 },
        { type: 'pro', title: 'The Spotlight Effect', meta: '心理学', p: 0.4 },
        { type: 'news', title: 'The Science of Procrastination', meta: '四级', p: 0.3 }
      ] },
      { label: '2026 年 8 月', items: [
        { type: 'pro', title: 'Opportunity Cost, Explained', meta: '经济学', p: 1 },
        { type: 'book', title: 'Atomic Habits', meta: 'James Clear', p: 1 },
        { type: 'news', title: 'What a Four-Day Week Really Changes', meta: '四级', p: 1 },
        { type: 'pod', title: '资讯快听 · AI Agents', meta: '12 分钟', p: 0.7 },
        { type: 'pro', title: 'How Neural Networks Learn', meta: '计算机', p: 0 }
      ] }
    ];
    const mk = (d) => ({
      title: d.title,
      meta: d.meta,
      typeLabel: T[d.type].label,
      color: T[d.type].color,
      dash: (d.p * C).toFixed(2) + ' ' + C.toFixed(2)
    });
    const groups = GROUPS.map((g) => ({
      label: g.label,
      items: g.items.filter((d) => !cat || d.type === cat).map(mk)
    })).filter((g) => g.items.length > 0);
    const c = {};
    Object.keys(T).forEach((k) => {
      const on = cat === k;
      c[k] = {
        on: on,
        pressed: on ? 'true' : 'false',
        shadow: on ? '4px 4px 0 #1C1C1C' : '2px 2px 0 #1C1C1C',
        pick: () => this.setState({ cat: on ? null : k })
      };
    });
    const reading = [
      { type: 'news', title: 'Why Every Company Suddenly Wants an AI Agent', meta: '六级 · 418 词', p: 0.6 },
      { type: 'book', title: 'How to Know a Person', meta: 'David Brooks', p: 0.25 },
      { type: 'pro', title: 'The Spotlight Effect', meta: '心理学 · 六级', p: 0.4 }
    ].map(mk);
    const saved = [
      { type: 'book', title: 'Thinking, Fast and Slow', meta: 'Daniel Kahneman', p: 0.5 },
      { type: 'pro', title: 'Opportunity Cost, Explained', meta: '经济学', p: 1 },
      { type: 'news', title: 'What a Four-Day Week Really Changes', meta: '四级', p: 1 },
      { type: 'pod', title: '资讯快听 · AI Agents', meta: '12 分钟', p: 0.7 }
    ].map(mk);
    const isArch = tab === 'arch';
    return {
      isArch: isArch,
      isMine: !isArch,
      archStr: isArch ? 'true' : 'false',
      mineStr: isArch ? 'false' : 'true',
      archBg: isArch ? '#1C1C1C' : 'transparent',
      archFg: isArch ? '#FBF8F1' : '#1C1C1C',
      mineBg: isArch ? 'transparent' : '#1C1C1C',
      mineFg: isArch ? '#1C1C1C' : '#FBF8F1',
      goArch: () => this.setState({ tab: 'arch' }),
      goMine: () => this.setState({ tab: 'mine' }),
      c: c,
      groups: groups,
      listTitle: cat ? T[cat].label : '全部',
      listCount: cat ? T[cat].total + ' 篇' : '612 篇',
      reading: reading,
      saved: saved
    };
  }
}
</script>
