<script type="text/x-dc" data-dc-script data-props='{"nav":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 28, sheet: false, f: { cat: {}, lvl: {}, dur: {}, sort: 'new' } };
  }

  filterVals() {
    const s = this.state || {};
    const f = s.f || { cat: {}, lvl: {}, dur: {}, sort: 'new' };
    const TOTAL = { news: 212, pro: 146, book: 96, pod: 158 };
    const GROUPS = [
      { id: 'cat', label: '分类', multi: true, opts: [['news', '资讯'], ['pro', '专业'], ['book', '拆书'], ['pod', '播客']] },
      { id: 'lvl', label: '难度', multi: true, opts: [['c4', '四级'], ['c6', '六级'], ['ty', '托雅']] },
      { id: 'dur', label: '时长', multi: true, opts: [['s', '5 分钟内'], ['m', '5–15 分钟'], ['l', '15 分钟以上']] },
      { id: 'sort', label: '排序', multi: false, opts: [['new', '最新在前'], ['old', '最早在前']] }
    ];
    const setF = (next) => this.setState({ f: next });
    const fgroups = GROUPS.map((g) => ({
      label: g.label,
      opts: g.opts.map(([id, label]) => {
        const on = g.multi ? !!f[g.id][id] : f.sort === id;
        return {
          label: label,
          bg: on ? '#9EC0C0' : '#FBF8F1',
          pressed: on ? 'true' : 'false',
          pick: () => {
            const next = Object.assign({}, f);
            if (g.multi) {
              const m = Object.assign({}, f[g.id]);
              if (m[id]) delete m[id]; else m[id] = true;
              next[g.id] = m;
            } else {
              next.sort = id;
            }
            setF(next);
          }
        };
      })
    }));
    const cats = Object.keys(f.cat);
    const base = cats.length ? cats.reduce((n, k) => n + TOTAL[k], 0) : 612;
    const lv = Object.keys(f.lvl).length;
    const du = Object.keys(f.dur).length;
    return {
      fgroups: fgroups,
      resultCount: Math.max(1, Math.round(base * (lv ? lv / 3 : 1) * (du ? du / 3 : 1))),
      hasFilter: cats.length + lv + du > 0,
      sheetOpen: !!s.sheet,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      resetF: () => setF({ cat: {}, lvl: {}, dur: {}, sort: 'new' })
    };
  }

  renderVals() {
    const __nav = this.props.nav;
    const __go = (to, href) => ({ href: __nav ? '#' : href, click: (e) => { if (__nav) { if (e && e.preventDefault) e.preventDefault(); __nav(to); } } });
    const L = {today: __go('today', 'GreetB.dc.html'), me: __go('me', 'MeD.dc.html'), intro: __go('intro', 'ArticleIntroPhoto.dc.html')};
    const s = this.state || {};
    const selDay = s.day || 28;
    const C = 2 * Math.PI * 4.25;
    const dash = (p) => (p * C).toFixed(2) + ' ' + C.toFixed(2);
    const T = {
      news: { label: '资讯', color: '#925F50' },
      pro: { label: '专业', color: '#2F5E60' },
      book: { label: '拆书', color: '#1C1C1C' },
      pod: { label: '播客', color: '#D89585' }
    };
    const POOLS = {
      book: ['How to Know a Person', 'Atomic Habits', 'Thinking, Fast and Slow', 'The Anxious Generation', 'Range'],
      news: ['Why Every Company Suddenly Wants an AI Agent', 'What a Four-Day Week Really Changes', 'The Science of Procrastination', 'Inside the Race to Build Cheaper Batteries', 'Why Cities Are Banning Cars Again', 'The Quiet Comeback of Paper Books'],
      pro: ['Opportunity Cost, Explained', 'The Spotlight Effect', 'How Neural Networks Learn', 'Why Empires Fall'],
      pod: ['拆书播客 · Atomic Habits', '资讯快听 · AI Agents', '拆书播客 · Range']
    };
    const BY_WEEKDAY = ['pro', 'book', 'news', 'pro', 'news', 'pod', 'news'];
    const WK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const TODAY = 28;
    const info = (d) => {
      const wd = new Date(2026, 8, d).getDay();
      const type = BY_WEEKDAY[wd];
      const pool = POOLS[type];
      let p = 1;
      if (d === TODAY) p = 0.25;
      else if (d % 5 === 0) p = 0;
      else if (d % 4 === 0) p = 0.5;
      else if (d > 22 && d % 3 === 0) p = 0;
      const title = d === TODAY ? 'How to Know a Person' : pool[d % pool.length];
      return { type: type, title: title, p: p, wd: wd, no: 496 - (TODAY - d) };
    };
    const cells = [];
    const offset = 1;
    for (let i = 0; i < 35; i++) {
      const day = i - offset + 1;
      if (day < 1 || day > 30) {
        cells.push({ blank: true, isDay: false });
        continue;
      }
      const future = day > TODAY;
      const it = future ? null : info(day);
      const on = day === selDay;
      const full = it && it.p === 1;
      let bg = '#FBF8F1';
      let fg = '#1C1C1C';
      let border = '1px solid #D9D4CA';
      let weight = '500';
      if (full) { bg = '#DCE8E7'; border = '1px solid #B9D0CF'; }
      if (day === TODAY) { bg = '#9EC0C0'; border = '1.5px solid #1C1C1C'; weight = '700'; }
      if (future) { fg = '#9A958C'; border = '1px dashed #CFCAC0'; }
      if (on && day !== TODAY) { border = '1.5px solid #1C1C1C'; }
      cells.push({
        blank: false,
        isDay: true,
        day: day,
        future: future,
        aria: '9 月 ' + day + ' 日',
        pressed: on ? 'true' : 'false',
        bg: bg,
        fg: fg,
        border: border,
        weight: weight,
        shadow: on ? '3px 3px 0 #D89585' : 'none',
        lift: on ? 'translate(-1px, -1px)' : 'none',
        bar: it && !full ? Math.round(it.p * 100) + '%' : '0%',
        pick: () => { if (!future) this.setState({ day: day }); }
      });
    }
    const si = info(selDay);
    const sel = {
      dateLine: '9 月 ' + selDay + ' 日 ' + WK[si.wd] + ' · 日推 ' + si.no,
      title: si.title,
      typeLabel: T[si.type].label,
      color: T[si.type].color,
      dash: dash(si.p)
    };
    const reading = [
      { title: 'Why Every Company Suddenly Wants an AI Agent', p: 0.6 },
      { title: 'How to Know a Person', p: 0.25 },
      { title: 'The Spotlight Effect', p: 0.4 }
    ].map((d) => ({ title: d.title, dash: dash(d.p) }));
    return Object.assign({ cells: cells, sel: sel, reading: reading, L: L }, this.filterVals());
  }
}
</script>
