<x-dc>
<helmet>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #ECE9E2; color: #1C1C1C; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif">

<h1 style="margin: 0; font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 30px; line-height: 44px; letter-spacing: 2px">资料库</h1>
<div style="display: flex; align-items: center">
<button type="button" aria-label="搜索" style="width: 44px; height: 44px; border: 0; padding: 0; background: transparent; color: #1C1C1C; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
</button>
<button type="button" aria-label="筛选" onClick="{{openSheet}}" style="position: relative; width: 44px; height: 44px; border: 0; padding: 0; background: transparent; color: #1C1C1C; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10"></path><path d="M18 7h2"></path><circle cx="16" cy="7" r="2"></circle><path d="M4 17h2"></path><path d="M10 17h10"></path><circle cx="8" cy="17" r="2"></circle></svg>

<span aria-hidden="true" style="position: absolute; top: 9px; right: 8px; width: 9px; height: 9px; box-sizing: border-box; border: 1.5px solid #1C1C1C; border-radius: 5px; background: #9EC0C0"></span>
</sc-if>
</button>
</div>
</div>

<div role="group" aria-label="模块" style="margin: 10px 16px 0 16px; padding: 3px; box-sizing: border-box; background: #FBF8F1; border: 1.5px solid #1C1C1C; border-radius: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px">
<button type="button" aria-pressed="{{deskStr}}" onClick="{{goDesk}}" style="height: 40px; box-sizing: border-box; border: 1.5px solid {{deskBorder}}; border-radius: 20px; background: {{deskBg}}; color: #1C1C1C; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">我的书桌</button>
<button type="button" aria-pressed="{{archStr}}" onClick="{{goArch}}" style="height: 40px; box-sizing: border-box; border: 1.5px solid {{archBorder}}; border-radius: 20px; background: {{archBg}}; color: #1C1C1C; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">历史资料库</button>
</div>

<sc-if value="{{isArch}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column">

<div style="margin: 16px 16px 0 16px; box-sizing: border-box; padding: 14px 14px 16px 14px; background: #9EC0C0; border: 1.5px solid #1C1C1C; border-radius: 22px; display: flex; flex-direction: column; gap: 12px">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'arch', month: 9, sheet: false, f: { cat: {}, lvl: {}, dur: {}, sort: 'new' } };
  }

  filterVals() {
    const s = this.state || {};
    const f = s.f || { cat: {}, lvl: {}, dur: {}, sort: 'new' };
    const TOTAL = { news: 212, pro: 146, book: 96, pod: 158 };
    const GROUPS = [
      { id: 'cat', label: '分类', multi: true, opts: [['news', '资讯'], ['pro', '专业'], ['book', '拆书'], ['pod', '播客']] },
      { id: 'lvl', label: '难度', multi: true, opts: [['c4', '四级'], ['c6', '六级'], ['ty', '托雅']] },
      { id: 'dur', label: '时长', multi: true, opts: [['s', '5 分钟内'], ['m', '5–15 分钟'], ['l', '15 分钟以上']] },
      { id: 'sort', label: '排序', multi: false, opts: [['new', '最新在前'], ['old', '最早在前']] }
    ];
    const setF = (next) => this.setState({ f: next });
    const fgroups = GROUPS.map((g) => ({
      label: g.label,
      opts: g.opts.map(([id, label]) => {
        const on = g.multi ? !!f[g.id][id] : f.sort === id;
        return {
          label: label,
          bg: on ? '#9EC0C0' : '#FBF8F1',
          pressed: on ? 'true' : 'false',
          pick: () => {
            const next = Object.assign({}, f);
            if (g.multi) {
              const m = Object.assign({}, f[g.id]);
              if (m[id]) delete m[id]; else m[id] = true;
              next[g.id] = m;
            } else {
              next.sort = id;
            }
            setF(next);
          }
        };
      })
    }));
    const cats = Object.keys(f.cat);
    const base = cats.length ? cats.reduce((n, k) => n + TOTAL[k], 0) : 612;
    const lv = Object.keys(f.lvl).length;
    const du = Object.keys(f.dur).length;
    const resultCount = Math.max(1, Math.round(base * (lv ? lv / 3 : 1) * (du ? du / 3 : 1)));
    return {
      fgroups: fgroups,
      resultCount: resultCount,
      hasFilter: cats.length + lv + du > 0,
      sheetOpen: !!s.sheet,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      resetF: () => setF({ cat: {}, lvl: {}, dur: {}, sort: 'new' })
    };
  }

  renderVals() {
    const s = this.state || {};
    const tab = s.tab || 'arch';
    const month = s.month || 9;
    const C = 2 * Math.PI * 4.25;
    const dash = (p) => (p * C).toFixed(2) + ' ' + C.toFixed(2);
    const T = {
      news: { label: '资讯', color: '#925F50' },
      pro: { label: '专业', color: '#2F5E60' },
      book: { label: '拆书', color: '#1C1C1C' },
      pod: { label: '播客', color: '#D89585' }
    };
    const DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 28];
    const COVER = [0, 0.1, 0.2, 0.3, 0.5, 0.6, 0.8, 0.9, 0.4];
    const months = DAYS.map((n, i) => {
      const m = i + 1;
      const on = m === month;
      return {
        label: m + ' 月',
        count: n + ' 篇',
        dash: dash(COVER[i]),
        bg: on ? '#9EC0C0' : '#FBF8F1',
        shadow: on ? '3px 3px 0 #1C1C1C' : 'none',
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ month: m })
      };
    }).reverse();
    const POOL = [
      { type: 'book', title: 'How to Know a Person' },
      { type: 'news', title: 'Why Every Company Suddenly Wants an AI Agent' },
      { type: 'pro', title: 'The Spotlight Effect' },
      { type: 'news', title: 'The Science of Procrastination' },
      { type: 'pod', title: '资讯快听 · AI Agents' },
      { type: 'pro', title: 'Opportunity Cost, Explained' },
      { type: 'book', title: 'Atomic Habits' }
    ];
    const WK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const last = DAYS[month - 1];
    const monthItems = [0, 1, 2, 3, 4].map((k) => {
      const day = last - k;
      const d = new Date(2026, month - 1, day);
      const it = POOL[(day + month) % POOL.length];
      const p = month < 9 ? (k === 2 ? 0.5 : 1) : [0.25, 0.6, 0, 0.4, 1][k];
      return { day: day, wk: WK[d.getDay()], title: it.title, typeLabel: T[it.type].label, color: T[it.type].color, dash: dash(p) };
    });
    const mk = (d) => ({ title: d.title, meta: d.meta, typeLabel: T[d.type].label, color: T[d.type].color, dash: dash(d.p) });
    const reading = [
      { type: 'news', title: 'Why Every Company Suddenly Wants an AI Agent', meta: '六级 · 418 词', p: 0.6 },
      { type: 'book', title: 'How to Know a Person', meta: 'David Brooks', p: 0.25 },
      { type: 'pro', title: 'The Spotlight Effect', meta: '心理学 · 六级', p: 0.4 }
    ].map(mk);
    const saved = [
      { type: 'book', title: 'Thinking, Fast and Slow', meta: 'Daniel Kahneman', p: 0.5 },
      { type: 'pro', title: 'Opportunity Cost, Explained', meta: '经济学', p: 1 },
      { type: 'news', title: 'What a Four-Day Week Really Changes', meta: '四级', p: 1 },
      { type: 'pod', title: '资讯快听 · AI Agents', meta: '12 分钟', p: 0.7 }
    ].map(mk);
    const isArch = tab === 'arch';
    return Object.assign({
      isArch: isArch,
      isDesk: !isArch,
      archStr: isArch ? 'true' : 'false',
      deskStr: isArch ? 'false' : 'true',
      archBg: isArch ? '#9EC0C0' : 'transparent',
      archBorder: isArch ? '#1C1C1C' : 'transparent',
      deskBg: isArch ? 'transparent' : '#9EC0C0',
      deskBorder: isArch ? 'transparent' : '#1C1C1C',
      goArch: () => this.setState({ tab: 'arch' }),
      goDesk: () => this.setState({ tab: 'desk' }),
      months: months,
      monthTitle: '2026 年 ' + month + ' 月 · ' + DAYS[month - 1] + ' 篇',
      monthItems: monthItems,
      reading: reading,
      saved: saved
    }, this.filterVals());
  }
}
</script>
