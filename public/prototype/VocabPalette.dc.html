<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Vocabulary 取色</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0;background:#EEEBE3}
</style>
</helmet>
<div style="width: 820px; height: 540px; box-sizing: border-box; padding: 32px 36px; background: #EEEBE3; color: #1C1C1C; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; align-items: baseline; justify-content: space-between">
<div style="display: flex; align-items: baseline; gap: 12px">
<h1 style="margin: 0; font-family: Newsreader, Georgia, serif; font-weight: 500; font-size: 30px; line-height: 36px; letter-spacing: -0.3px; color: #1C1C1C">Vocabulary</h1>
<span style="font-size: 15px; color: #56524D">取色</span>
</div>
<span style="font-size: 12px; color: #56524D">从 App Store 截图逐点取样</span>
</div>

<div style="display: flex; gap: 12px; height: 150px">
<div style="flex-grow: 3; flex-basis: 0; border-radius: 16px; background: #9EC0C0; padding: 18px 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 15px; font-weight: 600; color: #1C1C1C">雾青</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 15px; color: #1C1C1C">#9EC0C0</span>
</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: Newsreader, Georgia, serif; font-size: 26px; line-height: 30px; color: #1C1C1C">Aa 墨色字</span>
<span style="font-size: 12px; color: #1C1C1C">对比度 8.7 : 1，可做正文</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; align-items: flex-end">
<span style="font-family: Newsreader, Georgia, serif; font-size: 26px; line-height: 30px; color: #FFFFFF">Aa 白字</span>
<span style="font-size: 12px; color: #1C1C1C">1.9 : 1，只够大标题</span>
</div>
</div>
</div>
<div style="flex-grow: 2; flex-basis: 0; border-radius: 16px; background: #D89585; padding: 18px 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 15px; font-weight: 600; color: #1C1C1C">珊瑚</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 15px; color: #1C1C1C">#D89585</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: Newsreader, Georgia, serif; font-size: 26px; line-height: 30px; color: #1C1C1C">Aa 墨色字</span>
<span style="font-size: 12px; color: #1C1C1C">6.9 : 1 · 第二整屏色</span>
</div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 56px; border-radius: 10px; background: #EEEBE3; box-shadow: inset 0 0 0 1px rgba(28, 28, 28, 0.14)"></div>
<span style="font-size: 13px; line-height: 18px; font-weight: 600">纸灰</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 13px; line-height: 16px; color: #56524D">#EEEBE3</span>
<span style="font-size: 11px; line-height: 15px; color: #56524D">页面底色</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 56px; border-radius: 10px; background: #FBF8F1; box-shadow: inset 0 0 0 1px rgba(28, 28, 28, 0.10)"></div>
<span style="font-size: 13px; line-height: 18px; font-weight: 600">奶白</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 13px; line-height: 16px; color: #56524D">#FBF8F1</span>
<span style="font-size: 11px; line-height: 15px; color: #56524D">单词卡片</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 56px; border-radius: 10px; background: #1C1C1C"></div>
<span style="font-size: 13px; line-height: 18px; font-weight: 600">墨</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 13px; line-height: 16px; color: #56524D">#1C1C1C</span>
<span style="font-size: 11px; line-height: 15px; color: #56524D">单词、线描插画</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 56px; border-radius: 10px; background: #56524D"></div>
<span style="font-size: 13px; line-height: 18px; font-weight: 600">暖灰</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 13px; line-height: 16px; color: #56524D">#56524D</span>
<span style="font-size: 11px; line-height: 15px; color: #56524D">次要文字</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 56px; border-radius: 10px; background: #925F50"></div>
<span style="font-size: 13px; line-height: 18px; font-weight: 600">陶土</span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 13px; line-height: 16px; color: #56524D">#925F50</span>
<span style="font-size: 11px; line-height: 15px; color: #56524D">小标签底色</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 56px; box-sizing: border-box; border-radius: 10px; background: #2F5E60; border: 1.5px dashed #EEEBE3; box-shadow: 0 0 0 1.5px #2F5E60"></div>
<span style="font-size: 13px; line-height: 18px; font-weight: 600">深青 <span style="font-weight: 400; color: #56524D">· 补充</span></span>
<span style="font-family: Newsreader, Georgia, serif; font-size: 13px; line-height: 16px; color: #56524D">#2F5E60</span>
<span style="font-size: 11px; line-height: 15px; color: #56524D">按钮、链接</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; line-height: 17px; font-weight: 500; color: #56524D">截图里的面积占比</span>
<div style="display: flex; height: 14px; border-radius: 7px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(28, 28, 28, 0.10)">
<span style="width: 33%; background: #E3DFD4"></span>
<span style="width: 26%; background: #FBF8F1"></span>
<span style="width: 30%; background: #9EC0C0"></span>
<span style="width: 5%; background: #D89585"></span>
<span style="width: 3%; background: #1C1C1C"></span>
<span style="width: 2%; background: #56524D"></span>
<span style="width: 1%; background: #925F50"></span>
</div>
<div style="display: flex; gap: 16px; font-size: 11px; line-height: 15px; color: #56524D">
<span>纸灰 33%</span>
<span>奶白 26%</span>
<span>雾青 30%</span>
<span>珊瑚 5%</span>
<span>墨 3%</span>
<span>暖灰 2%</span>
<span>陶土 1%</span>
</div>
</div>

</div>
</x-dc>
