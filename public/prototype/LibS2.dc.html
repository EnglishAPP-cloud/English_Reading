<div style="padding: 12px 16px 0 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px">
<sc-for list="{{recent}}" as="it" hint-placeholder-count="6">
<a href="#" style="display: flex; flex-direction: column; box-sizing: border-box; background: #FBF8F1; border: 1.5px solid #1C1C1C; border-radius: 14px; box-shadow: 3px 3px 0 #1C1C1C; overflow: hidden; text-decoration: none; color: #1C1C1C">
<span style="height: 104px; box-sizing: border-box; padding: 10px 12px; background: {{it.color}}; color: {{it.fg}}; border-bottom: 1.5px solid #1C1C1C; display: flex; flex-direction: column; justify-content: space-between">
<span style="align-self: flex-start; display: inline-flex; align-items: center; height: 20px; box-sizing: border-box; padding: 0 7px; border: 1.5px solid {{it.fg}}; border-radius: 10px; font-size: 11px; font-weight: 600">{{it.typeLabel}}</span>
<span style="font-family: Newsreader, 'Noto Sans SC', serif; font-style: italic; font-size: 16px; line-height: 19px; font-weight: 500; max-height: 38px; overflow: hidden">{{it.cover}}</span>
</span>
<span style="padding: 10px 12px 12px 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; line-height: 18px; font-weight: 600; height: 36px; overflow: hidden">{{it.title}}</span>
<span style="font-size: 11px; line-height: 15px; color: #56524D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.meta}}</span>
<span aria-hidden="true" style="margin-top: 6px; height: 3px; border-radius: 2px; background: #E1DDD3; overflow: hidden; display: flex"><span style="width: {{it.pct}}; background: #1C1C1C"></span></span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const TYPES = {
      news: { label: '资讯', color: '#925F50', fg: '#FBF8F1' },
      pro: { label: '专业', color: '#2F5E60', fg: '#FBF8F1' },
      book: { label: '拆书', color: '#1C1C1C', fg: '#FBF8F1' },
      pod: { label: '播客', color: '#D89585', fg: '#1C1C1C' }
    };
    const DATA = [
      { type: 'news', cover: 'AI Agents', title: 'Why Every Company Suddenly Wants an AI Agent', meta: '六级 · 418 词', p: 0.6 },
      { type: 'book', cover: 'How to Know a Person', title: 'How to Know a Person', meta: 'David Brooks', p: 0.25 },
      { type: 'pod', cover: 'Episode 496', title: '拆书播客 · How to Know a Person', meta: '24 分钟', p: 0 },
      { type: 'pro', cover: 'Economics', title: 'Opportunity Cost, Explained', meta: '经济学 · 托雅', p: 1 },
      { type: 'pro', cover: 'Psychology', title: 'The Spotlight Effect', meta: '心理学 · 六级', p: 0.4 },
      { type: 'news', cover: 'Work', title: 'What a Four-Day Week Really Changes', meta: '四级 · 536 词', p: 1 }
    ];
    const recent = DATA.map((d) => {
      const t = TYPES[d.type];
      return {
        cover: d.cover,
        title: d.title,
        meta: d.meta,
        typeLabel: t.label,
        color: t.color,
        fg: t.fg,
        pct: Math.round(d.p * 100) + '%'
      };
    });
    return { recent: recent };
  }
}
</script>
