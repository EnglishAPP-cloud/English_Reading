# 网页版：把 APP 打包成网页，发布到 GitHub Pages。
# 网址：https://<用户名>.github.io/<仓库名>/
#
# 做法：打包结果推到 gh-pages 分支（只放打包好的网页文件，每次整个覆盖），
# GitHub Pages 从这个分支提供网页。第一次要在仓库 Settings → Pages 里选一次 gh-pages 分支（见 README）。
name: 发布网页版

on:
  push:
    # PR 合并前也从开发分支发布，方便先拿链接给别人看；以后以 main 为准
    branches: [main, claude/admiring-hopper-nkjnuh]
  workflow_dispatch:

permissions:
  contents: write # 要往 gh-pages 分支推送

# 连续推送时只发布最新一次
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: 打包并发布网页版
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 网址带仓库名前缀，告诉 Expo（见 app.config.js）
      - name: 打包网页
        run: WEB_BASE_URL="/${GITHUB_REPOSITORY#*/}" npm run build:web

      - name: 补上 GitHub Pages 需要的文件
        run: |
          # 直接打开 /article/xxx 这类网址时 GitHub Pages 找不到文件，会返回 404.html；
          # 404.html 就是 APP 本身，会按网址显示对应页面
          cp dist/index.html dist/404.html
          # 关掉 Jekyll 处理，否则 _expo、node_modules 开头的目录会被忽略，网页打不开
          touch dist/.nojekyll

      - name: 推到 gh-pages 分支
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "发布网页版：${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "已发布到 gh-pages 分支。网址：https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
